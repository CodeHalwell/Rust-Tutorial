[package]
name = "grep_clone"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1.10"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "search_performance"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
